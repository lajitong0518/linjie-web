<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover：让页面铺到刘海和小白条底下，再用 env(safe-area-inset-*) 让位。
     不加的话手机上会出现一条与系统状态栏重复的空白带。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F1F6">
<title>临界 · Web 版</title>
<!-- ★ 资源都带一个版本号参数（问号 v 等于号，形如 app.css?v=0923a）：
     每次部署改这个号（push-api 推 js/css 时会自动换）。
     不带版本号时浏览器会缓存旧 CSS/JS，普通刷新只重新拿 HTML ——
     用户"刷新了也看不到新界面"，还以为没部署（坑 40）。
     ★ 注释里别写裸的问号 v 等于引号形式，会被换号正则误伤。 -->
<link rel="stylesheet" href="app.css?v=mue5l1sk">
</head>
<body>

<div id="stage">
  <div id="app-host"><!-- 手机挂载点 --></div>
  <aside id="devbar"><!-- 开发/测试面板，不属于产品 UI --></aside>
</div>

<div id="toast-root"></div>
<div id="sheet-root"></div>

<!-- 传统 script 顺序加载（不要改成 type=module，file:// 下会被 CORS 拦截） -->
<script src="js/store.js?v=mue5l1sk"></script>
<script src="js/metrics.js?v=mue5l1sk"></script>
<script src="js/engine.js?v=mue5l1sk"></script>
<script src="js/seed.js?v=mue5l1sk"></script>
<script src="js/clock.js?v=mue5l1sk"></script>
<script src="js/api.js?v=mue5l1sk"></script>
<script src="js/ui.js?v=mue5l1sk"></script>
<script src="js/router.js?v=mue5l1sk"></script>
<script src="js/pages-common.js?v=mue5l1sk"></script>
<script src="js/pages-youth.js?v=mue5l1sk"></script>
<script src="js/pages-youth-m2.js?v=mue5l1sk"></script>
<script src="js/pages-favor.js?v=mue5l1sk"></script>
<script src="js/pages-supporter.js?v=mue5l1sk"></script>
<script src="js/app.js?v=mue5l1sk"></script>
</body>
</html>
